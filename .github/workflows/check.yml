name: PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Forks cannot access the RPLATEX secret, which is required to check out
    # the private slides submodule – skip instead of failing red.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy.yml
    secrets:
      RPLATEX: ${{ secrets.RPLATEX }}
